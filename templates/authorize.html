<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign In - OIDC Provider</title>
  <link rel="stylesheet" href="{{ base_path }}/static/styles.css">
</head>
<body>
  <div class="login-container">
    <h1>🔐 Sign In</h1>
    <p class="subtitle">OIDC Test Provider — Compose `userinfo`</p>
    <form method="POST" action="{{ base_path }}/authorize" id="authForm">
      <input type="hidden" name="client_id" value="{{ client_id }}">
      <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
      <input type="hidden" name="state" value="{{ state }}">
      <input type="hidden" name="response_type" value="{{ response_type }}">
      <input type="hidden" name="code_challenge" value="{{ code_challenge }}">

      <!-- Hidden field that will receive serialized claims JSON -->
      <input type="hidden" id="userinfo" name="userinfo">

      <div class="form-group">
        <label>Claims</label>
        <div id="claimsContainer"></div>
        <div style="margin-top:8px">
          <button type="button" id="addClaim">+ Add claim</button>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit">Sign In</button>
      </div>
    </form>

    <div class="info-box">
      <strong>Test Provider:</strong><br>
      Edit the JSON above to compose the claims you want returned in the token and from `/userinfo`.<br>
      The JSON you submit is saved in a cookie for convenient re-use on subsequent authorize requests.
    </div>
  </div>

  <script>
    (function(){
      const form = document.getElementById('authForm');
      const container = document.getElementById('claimsContainer');
      const hidden = document.getElementById('userinfo');
      const addBtn = document.getElementById('addClaim');

      // Parse server-provided saved_userinfo or use default
      let initial = null;
      try {
        initial = {{ saved_userinfo|tojson if saved_userinfo else 'null' }};
      } catch (e) {
        initial = null;
      }
      // If server passed a JSON string, parse it into an object
      if (typeof initial === 'string' && initial) {
        try {
          initial = JSON.parse(initial);
        } catch (e) {
          initial = null;
        }
      }
      if (!initial) {
        try { initial = JSON.parse('{"sub":"user@example.com","email":"user@example.com","groups":["developer"]}'); } catch(e){ initial = {} }
      }

      function toDisplayValue(v) {
        if (Array.isArray(v) || typeof v === 'object') return JSON.stringify(v);
        return String(v);
      }

      function renderRows(obj){
        container.innerHTML = '';
        Object.keys(obj || {}).forEach(function(key){
          addRow(key, toDisplayValue(obj[key]));
        });
      }

      function addRow(key='', value=''){
        const row = document.createElement('div');
        row.className = 'claim-row';
        row.style.marginTop = '8px';
        row.style.display = 'grid';
        row.style.gridTemplateColumns = '140px 1fr 40px';
        row.style.gridColumnGap = '8px';
        row.style.alignItems = 'center';

        const k = document.createElement('input');
        k.type = 'text'; k.placeholder = 'claim name (e.g. sub)'; k.value = key; k.style.width = '100%'; k.style.boxSizing = 'border-box';

        const v = document.createElement('input');
        v.type = 'text'; v.placeholder = 'value (plain or JSON)'; v.value = value; v.style.width = '100%'; v.style.boxSizing = 'border-box';

        const rem = document.createElement('button');
        rem.type = 'button';
        rem.title = 'Remove claim';
        rem.setAttribute('aria-label', 'Remove claim');
        rem.style.width = '28px';
        rem.style.height = '28px';
        rem.style.padding = '0';
        rem.style.display = 'inline-flex';
        rem.style.alignItems = 'center';
        rem.style.justifyContent = 'center';
        rem.style.background = 'transparent';
        rem.style.border = '1px solid transparent';
        rem.style.borderRadius = '4px';
        rem.style.cursor = 'pointer';
        // use a compact red cross for remove
        rem.textContent = '✕';
        rem.style.color = '#ef4444';
        rem.style.fontSize = '16px';
        rem.style.lineHeight = '16px';
        rem.style.width = '28px';
        rem.style.height = '28px';
        rem.style.padding = '0';
        rem.style.display = 'inline-flex';
        rem.style.alignItems = 'center';
        rem.style.justifyContent = 'center';
        rem.style.background = 'transparent';
        rem.style.border = '1px solid transparent';
        rem.style.borderRadius = '4px';
        rem.style.cursor = 'pointer';
        rem.addEventListener('mouseenter', function(){ rem.style.background = 'rgba(239,68,68,0.08)'; });
        rem.addEventListener('mouseleave', function(){ rem.style.background = 'transparent'; });
        rem.addEventListener('click', function(){ container.removeChild(row); });

        row.appendChild(k);
        row.appendChild(v);
        row.appendChild(rem);
        container.appendChild(row);
      }

      addBtn.addEventListener('click', function(){ addRow(); });

      // render initial claims
      renderRows(initial);

      form.addEventListener('submit', function(evt){
        // Build object from rows
        const out = {};
        const rows = container.querySelectorAll('.claim-row');
        rows.forEach(function(row){
          const key = (row.children[0].value || '').trim();
          let val = (row.children[1].value || '').trim();
          if (!key) return;
          // try JSON parse, otherwise use string
          try { val = JSON.parse(val); }
          catch (e) { /* keep as string */ }
          out[key] = val;
        });

        const json = JSON.stringify(out);
        hidden.value = json;

        // save cookie for prefill on next authorize
        try {
          const cookieValue = encodeURIComponent(json);
          const path = '{{ base_path or '/' }}';
          document.cookie = 'mock_oidc_userinfo=' + cookieValue + '; path=' + path + '; SameSite=Lax';
        } catch (e) {
          // ignore cookie errors
        }
      });
    })();
  </script>
</body>
</html>
